# Conbert hinter nginx – nur HTTP, HTTPS ergänzt certbot.
#
# Installation (Debian/Ubuntu):
#   sudo cp nginx.conf /etc/nginx/sites-available/conbert
#   sudo ln -s /etc/nginx/sites-available/conbert /etc/nginx/sites-enabled/conbert
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d conbert.example.de
#
# Anpassen: server_name (deine Domain) und die Adresse im upstream-Block.

# WebSocket (Fortschritt der Umwandlungen unter /api/ws): Upgrade-Header
# weiterreichen, sonst normale Keep-Alive-Verbindung.
map $http_upgrade $conbert_connection {
    default upgrade;
    ''      '';
}

upstream conbert {
    # nginx auf demselben Rechner wie der Docker-Container:
    server 127.0.0.1:3313;
    # nginx als Container im selben Docker-Netz: stattdessen
    # server conbert:3313;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name conbert.example.de;

    # Uploads: so groß wie CONBERT_MAX_UPLOAD_MB (Standard 2048 MB).
    # 0 = kein Limit in nginx, Conbert prüft die Größe selbst.
    client_max_body_size 0;

    location / {
        proxy_pass http://conbert;
        proxy_http_version 1.1;

        # Wichtig: Conbert vergleicht den Origin des Browsers mit dem Host.
        # Ohne den echten Host lehnt der Server jede Änderung mit
        # „CROSS_ORIGIN“ ab (Anmelden, Hochladen …).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $conbert_connection;

        # Große Dateien direkt durchreichen statt erst auf die Platte von
        # nginx zu puffern (Uploads, ZIP-Downloads, Videos).
        proxy_request_buffering off;
        proxy_buffering off;

        # Lange Umwandlungen: /api/convert wartet bis zu 10 Minuten,
        # die WebSocket-Verbindung bleibt dauerhaft offen.
        proxy_connect_timeout 60s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        send_timeout 1h;
    }
}
