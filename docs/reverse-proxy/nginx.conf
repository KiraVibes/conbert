# Conbert hinter nginx - nur HTTP, HTTPS ergaenzt danach certbot.
#
#   sudo cp nginx.conf /etc/nginx/sites-available/conbert
#   sudo ln -s /etc/nginx/sites-available/conbert /etc/nginx/sites-enabled/conbert
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d conbert.example.de
#
# Anpassen: server_name (deine Domain) und die Adresse bei proxy_pass
# (IP des Rechners, auf dem Conbert laeuft, Port 3313).

server {
    listen 80;
    listen [::]:80;
    server_name conbert.example.de;

    # Uploads: Conbert prueft die Groesse selbst (Standard 2 GB).
    client_max_body_size 0;

    location / {
        proxy_pass http://192.168.1.10:3313;
        proxy_http_version 1.1;

        # Echten Host weitergeben - sonst lehnt Conbert Anmelden und
        # Hochladen ab (CROSS_ORIGIN).
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (Fortschrittsanzeige)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Grosse Dateien direkt durchreichen, lange Umwandlungen abwarten
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
