packages:
  - apps/*
  - packages/*

# Dependencies that may run install/build scripts (pnpm blocks all others).
allowBuilds:
  esbuild: true
  better-sqlite3: true
  # Optional native speed-up for BullMQ's msgpack (uses prebuilt binaries).
  msgpackr-extract: true
  # Its script only downloads optional CUDA (NVIDIA) parts – Conbert runs ONNX on the CPU.
  onnxruntime-node: false
